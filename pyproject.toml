[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "regression-witness"
version = "0.1.1"
description = "Reproducible before/after test evidence for open-source pull request reviews."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Regression Witness contributors"}]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
regression-witness = "regression_witness.__main__:main"

[project.urls]
Repository = "https://github.com/qjf1597300-cloud/regression-witness"
Issues = "https://github.com/qjf1597300-cloud/regression-witness/issues"

[tool.setuptools]
packages = ["regression_witness"]

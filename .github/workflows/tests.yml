name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test-only dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Unit, real-Git and pytest integration tests
        run: python -B -m unittest discover -s tests -v
      - name: Reproduce the synthetic demonstration
        run: python -B examples/demo.py --output "$RUNNER_TEMP/witness-demo"
